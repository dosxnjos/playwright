# Fork only (dosxnjos/playwright). Not a git hook: nobody runs `pre-commit install` here. The central's maestro
# closes every [[FEITO]] with `pre-commit run --files <files committed by the round>` in this repo; without this
# file the framework exits 1 (".pre-commit-config.yaml is not a file") and the round is read as rejected
# (measured 12/10/2026, one opus round lost). The real lint stays `npm run flint`. See FORK.md § Running the server.
repos:
  - repo: local
    hooks:
      - id: run-mcp-server-test
        name: wrapper unit test (node scripts/run-mcp-server.test.cjs)
        entry: node scripts/run-mcp-server.test.cjs
        language: system
        files: ^scripts/run-mcp-server.*\.cjs$
        pass_filenames: false
